name: Web, Pages and platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Web (primary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install debug overlay font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.7'
      - name: Configure web build (no ROM required)
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DSM_WEB_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build WebAssembly
        run: cmake --build build-web --target space-manbow-game -j2
      - name: Prepare Pages artifact
        run: |
          mkdir dist
          cp build-web/{index.html,launcher.js,game.js,game.wasm,game.data} dist/
          cp /usr/share/doc/fonts-dejavu-core/copyright dist/FONT-LICENSE.txt
          touch dist/.nojekyll
          python3 tools/check_web_artifact.py dist
      - name: Test ROM upload gate in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/web-test" playwright@1.58.2
          "$RUNNER_TEMP/web-test/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/web-test/node_modules" node tools/test_web.cjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Unrelated native job failures must never suppress a successful web deploy.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libsdl2-ttf-dev libpng-dev
      - name: Build
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci --target space-manbow-game -j2
      - name: Package
        run: |
          python3 tools/package_native.py build-ci/space-manbow-game package --platform linux
          tar -czf space-manbow-linux-${{ matrix.arch }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: space-manbow-linux-${{ matrix.arch }}
          path: space-manbow-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libpng mingw-w64-x86_64-python zip
      - name: Build
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci --target space-manbow-game -j2
      - name: Package with runtime DLLs
        run: |
          python tools/package_native.py build-ci/space-manbow-game.exe package --platform windows
          cp /mingw64/bin/*.dll package/
          cd package
          zip -qr ../space-manbow-windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: space-manbow-windows-x64
          path: space-manbow-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf libpng pkg-config dylibbundler
      - name: Build
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-ci --target space-manbow-game -j3
      - name: Bundle and sign
        run: |
          python3 tools/package_native.py build-ci/space-manbow-game package --platform macos
          dylibbundler -od -b -x package/space-manbow-game -d package/lib -p @executable_path/lib/
          find package/lib -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --sign - package/space-manbow-game
          tar -czf space-manbow-macos-arm64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: space-manbow-macos-arm64
          path: space-manbow-macos-arm64.tar.gz
          if-no-files-found: error

  android:
    name: Android ARM APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and prepare assets
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git android/sdl-source
          python3 tools/prepare_android.py android/sdl-source /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf /usr/share/doc/fonts-dejavu-core/copyright
      - name: Build ARM64 and ARMv7 APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: space-manbow-android-arm
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
