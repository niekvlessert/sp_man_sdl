plugins { id 'com.android.application' }
android {
    namespace 'nl.niekvlessert.spacemanbow'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'nl.niekvlessert.spacemanbow'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release'; targets 'space-manbow-game' } }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.java.srcDir '../sdl-java'
    sourceSets.main.assets.srcDir '../game-assets'
}
